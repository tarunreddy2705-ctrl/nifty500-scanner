name: Telegram connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send harmless Telegram test message
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID GitHub secret.")
          if not chat_id.lstrip("-").isdigit():
              raise SystemExit("Telegram chat ID must be numeric.")
          message = "NIFTY 500 Scanner: GitHub-to-Telegram connection test successful. No scanner was run. Not a trading signal."
          body = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode("utf-8")
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=body, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit("Telegram rejected the request (HTTP " + str(exc.code) + ").") from None
          except urllib.error.URLError:
              raise SystemExit("Unable to reach Telegram API.") from None
          if result.get("ok") is not True:
              raise SystemExit("Telegram did not confirm message delivery.")
          print("SUCCESS: Telegram API accepted the harmless test message.")
          PY
